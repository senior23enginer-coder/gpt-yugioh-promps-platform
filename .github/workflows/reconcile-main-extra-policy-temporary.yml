name: Reconcile authorized Main+Extra prompt protection
on:
  push:
    branches: [feat/a01-four-surface-contract-and-loaded-inventory-20261123]
    paths: [.github/workflows/reconcile-main-extra-policy-temporary.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/a01-four-surface-contract-and-loaded-inventory-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile protected SHA256 manifest against the authorized edited prompts
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const file='03_COMPROBACIONES_NO_IMPORTAR/HUELLAS_AUTORIZADAS_A10A_A10B_20261121.json';
          const record=JSON.parse(fs.readFileSync(file,'utf8'));
          for(const path of Object.keys(record.sha256))
            record.sha256[path]=crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          record.purpose='Approved 2026-11-23 Main+Extra minimum, Side+Reserve optional, GPT four-surface source';
          record.date='2026-11-23';
          fs.writeFileSync(file,JSON.stringify(record,null,2)+'\n');
          NODE
          node scripts/reconcile-protected-prompts.cjs --check
          node scripts/analysis-eligibility-test.cjs
          node scripts/test-a01-a10-presentation.cjs
          node scripts/test-a01-profile-contract.cjs
          node scripts/test-a01-player-guide-contract.cjs
      - name: Commit manifest and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 03_COMPROBACIONES_NO_IMPORTAR/HUELLAS_AUTORIZADAS_A10A_A10B_20261121.json
          git rm .github/workflows/reconcile-main-extra-policy-temporary.yml
          git commit -m 'test(gate): reconcile protected prompt SHA256 for Main and Extra minimum'
          git push origin HEAD:feat/a01-four-surface-contract-and-loaded-inventory-20261123
