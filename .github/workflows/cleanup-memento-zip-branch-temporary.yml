name: Clean temporary Memento ZIP build branch
on:
  push:
    branches:
      - ops/memento-671-import-zip-20261123
    paths:
      - .github/workflows/cleanup-memento-zip-branch-temporary.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve branch tip as backup tag and remove temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="ops/memento-671-import-zip-20261123"
          test "$(gh api "repos/$repo" --jq .default_branch)" = "base"
          sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
          tag="refs/tags/backup/memento-671-import-package-20261123"
          gh api -X POST "repos/$repo/git/refs" -f "ref=$tag" -f "sha=$sha" >/dev/null
          test "$(gh api "repos/$repo/git/ref/tags/backup/memento-671-import-package-20261123" --jq '.object.sha')" = "$sha"
          gh api -X DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
          echo "Backed up $sha and deleted temporary branch"
