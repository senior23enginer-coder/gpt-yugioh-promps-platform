name: A03 assigned deck official-source evidence (read only)
on:
  push:
    branches: ['analysis/a03-16-decks-20261124']
    paths: ['.github/workflows/a03-assigned-official-source-audit-temporary.yml']
permissions:
  contents: read
jobs:
  official-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit explicitly assigned decks in order, preserve cards and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          python3 - <<'PY'
          import concurrent.futures, hashlib, html, json, pathlib, re, subprocess, time, unicodedata, urllib.parse, urllib.request
          from datetime import datetime, timezone
          scope=[
            (671,'NUEVO_12_MEMENTOTLAN_DEMONIHERRERO'),(677,'NUEVO_13_CRISTRON_HORUS'),
            (665,'665_KASHTIRA_PURE'),(650,'650_ELFNOTE'),(653,'653_DOOMZ'),
            (656,'656_TEARLAMENTS'),(670,'670_INFERNOBLE'),(684,'684_CYBER_DRAGON_PURE'),
            (687,'687_VOLCANIC'),(660,'NUEVO_14_PURRELY'),(673,'NUEVO_15_SALAMANGRANDE'),
            (699,'NUEVO_16_GOAT_CONTROL'),(704,'704_PYRO'),(705,'705_ROYAL'),
            (706,'706_HERO'),(707,'707_DARK_MAGICIAN')]
          missing_native={660,673,699,705}
          root=pathlib.Path('01_INFORMACION_PARA_IMPORTAR/decks')
          output=pathlib.Path('outputs/a03-official-source-evidence.json')
          cache={}
          def norm(s):
              return ''.join(c for c in unicodedata.normalize('NFKD',str(s)).casefold() if c.isalnum())
          def clean(s):
              return html.unescape(re.sub(r'<[^>]+>','',re.sub(r'<br\s*/?>','\n',s,flags=re.I))).strip()
          def get(url):
              last=None
              for attempt in range(2):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'StationX-A03-SourceEvidence/1.0','Accept':'text/html,application/json'})
                      with urllib.request.urlopen(req,timeout=12) as response:
                          data=response.read(1500000)
                          return data.decode('utf-8','replace'),response.geturl()
                  except Exception as e:
                      last=str(e)
                      time.sleep(1+attempt)
              raise RuntimeError(last)
          def fetch(card,rush):
              cid=card['cid']
              url=next(s for s in card['sources'] if urllib.parse.urlparse(s).hostname=='www.db.yugioh-card.com' and urllib.parse.parse_qs(urllib.parse.urlparse(s).query).get('cid')==[str(cid)] and ('/rushdb/' in s)==rush)
              key=(cid,url)
              try:
                  if key not in cache:
                      page,final=get(url)
                      title_match=re.search(r'<title[^>]*>(.*?)</title>',page,re.I|re.S)
                      title=clean(title_match.group(1)).split('|')[0].strip() if title_match else ''
                      panel=re.search(r'<div\s+class=["\']item_box_text["\'][^>]*>',page,re.I)
                      if not panel: raise ValueError('MAIN_CARD_PANEL_MISSING')
                      segment=page[panel.start():panel.start()+14000]
                      m=re.search(r'<div\s+class=["\']text_linebreak["\'][^>]*>(.*?)</div>',segment,re.I|re.S)
                      if not m: raise ValueError('MAIN_CARD_TEXT_MISSING')
                      desc=clean(m.group(1))
                      if not title or not desc: raise ValueError('TITLE_OR_TEXT_EMPTY')
                      if urllib.parse.parse_qs(urllib.parse.urlparse(final).query).get('cid')!=[str(cid)]: raise ValueError('FINAL_CID_MISMATCH')
                      cache[key]={'source':url,'official_title':title,'text_sha256':hashlib.sha256(desc.encode()).hexdigest(),'text_chars':len(desc),'nonempty_text_lines':len([x for x in desc.splitlines() if x.strip()]),'numbered_clause_markers':len(re.findall(r'[①②③④⑤⑥⑦⑧⑨⑩]|(?:^|\n)\s*\([1-9]\)',desc)),'rush_effect_markers':len(re.findall(r'〖(?:効果|永続効果)〗|【(?:効果|永続効果)】',desc)),'retrieved':True}
                      time.sleep(.3)
                  evidence=dict(cache[key])
                  aliases=[card['name'],*card.get('source_aliases',[]),card.get('identity',{}).get('official_name',''),card.get('official_review',{}).get('nombre','')]
                  evidence['name_exact_normalized']=any(norm(a)==norm(evidence['official_title']) for a in aliases if a)
                  evidence['name_review_required']=not evidence['name_exact_normalized']
                  return dict(cid=cid,card_id=[s['card_id'] for s in card['slots']],inventory_name=card['name'],**evidence)
              except Exception as e:
                  return {'cid':cid,'inventory_name':card['name'],'source':url,'retrieved':False,'error':str(e)}
          report={'schema':'station-x-a03-source-evidence/1','started_at':datetime.now(timezone.utc).isoformat(),'scope':[i for i,_ in scope],'decks':[],'physical_inspection_certified':False,'native_skills_certified':False,'official_effect_census_certified':False,'inventory_changed':False,'production_written':False,'banlist_evaluated':False}
          for id,name in scope:
              p=root/('DECK_'+name)/'datos/stationx-deck.json'
              package=json.loads(p.read_text())
              subprocess.run(['node','scripts/analysis-eligibility.cjs',str(p),'--user-assigned','--deck-id='+str(id),'--stage=A03'],check=True)
              r=package['record']; assert package['deck_id']==r['deck_id']==id
              rush=r['format'] in ('rush','rush_duel')
              cards=r['cards']
              assert len({c['cid'] for c in cards})==len(cards)
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
                  results=list(pool.map(lambda c:fetch(c,rush),cards))
              deck={'deck_id':id,'name':r['name'],'format':r['format'],'identities':len(cards),'native_rows':len(package['inventory']),'retrieved':sum(x['retrieved'] for x in results),'name_exact_normalized':sum(x.get('name_exact_normalized',False) for x in results),'native_cid_reconciliation_required':id in missing_native,'skills':[s['name'] for s in r['skills']],'routes':len(r['routes']),'package_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'entries':results,'effect_marker_counts_are_diagnostics_only':True}
              report['decks'].append(deck)
              output.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
              print('A03_SOURCE_RESULT',json.dumps({k:v for k,v in deck.items() if k!='entries'},ensure_ascii=False),flush=True)
          report['finished_at']=datetime.now(timezone.utc).isoformat()
          report['retrieved_total']=sum(d['retrieved'] for d in report['decks'])
          report['identity_total']=sum(d['identities'] for d in report['decks'])
          output.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('A03_SOURCE_TOTAL',report['retrieved_total'],report['identity_total'])
          if report['retrieved_total']!=report['identity_total']: raise SystemExit('SOURCE_FETCH_PARTIAL: see artifact')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a03-assigned-official-source-evidence
          path: outputs/a03-official-source-evidence.json
          if-no-files-found: error
