name: Validate Station X prompt contracts

on:
  pull_request:
    branches: [base]
    paths:
      - '02_PROMPT_PARA_CODEX/**'
      - 'scripts/test-a01-a10-presentation.cjs'
      - 'scripts/test-paper-case-contract.cjs'
      - 'scripts/test-p06-legacy-paper-cases.cjs'
      - 'scripts/test-p06-route-trace-contract.cjs'
      - 'scripts/test-p06-physical-route-contract.cjs'
      - 'scripts/test-p06-golden-route-contract.cjs'
      - 'scripts/test-p06-legacy-assertion-inventory.cjs'
      - '03_COMPROBACIONES_NO_IMPORTAR/fixtures/**'
      - 'scripts/fixtures/stationx-paper-case.synthetic.json'
      - '02_PROMPT_PARA_CODEX/contrato_casos_logicos.schema.json'
      - 'scripts/analysis-eligibility*.cjs'
      - 'scripts/audit-deck-images.cjs'
      - 'scripts/audit-deck-visual-zone-links.cjs'
      - 'scripts/audit-deck-card-profiles.cjs'
      - 'scripts/audit-deck-effect-sources.cjs'
      - 'scripts/audit-deck-official-source-text.cjs'
      - 'scripts/compare-deck-cardtext-sources.cjs'
      - 'scripts/audit-deck-documental-effects.cjs'
      - 'scripts/audit-deck-causal-coverage.cjs'
      - 'scripts/audit-deck-paper-model.cjs'
      - 'scripts/audit-deck-a06-synergies.cjs'
      - 'scripts/audit-deck-a06-physical-paper.cjs'
      - 'scripts/audit-deck-a07-typed-rules.cjs'
      - 'scripts/audit-deck-a07-paper-cases.cjs'
      - '01_INFORMACION_PARA_IMPORTAR/decks/**'
      - '.github/workflows/validate-prompts.yml'
  push:
    branches: [base]
    paths:
      - '02_PROMPT_PARA_CODEX/**'
      - 'scripts/test-a01-a10-presentation.cjs'
      - 'scripts/test-paper-case-contract.cjs'
      - 'scripts/test-p06-legacy-paper-cases.cjs'
      - 'scripts/test-p06-route-trace-contract.cjs'
      - 'scripts/test-p06-physical-route-contract.cjs'
      - 'scripts/test-p06-golden-route-contract.cjs'
      - 'scripts/test-p06-legacy-assertion-inventory.cjs'
      - '03_COMPROBACIONES_NO_IMPORTAR/fixtures/**'
      - 'scripts/fixtures/stationx-paper-case.synthetic.json'
      - '02_PROMPT_PARA_CODEX/contrato_casos_logicos.schema.json'
      - 'scripts/analysis-eligibility*.cjs'
      - 'scripts/audit-deck-images.cjs'
      - 'scripts/audit-deck-visual-zone-links.cjs'
      - 'scripts/audit-deck-card-profiles.cjs'
      - 'scripts/audit-deck-effect-sources.cjs'
      - 'scripts/audit-deck-official-source-text.cjs'
      - 'scripts/compare-deck-cardtext-sources.cjs'
      - 'scripts/audit-deck-documental-effects.cjs'
      - 'scripts/audit-deck-causal-coverage.cjs'
      - 'scripts/audit-deck-paper-model.cjs'
      - 'scripts/audit-deck-a06-synergies.cjs'
      - 'scripts/audit-deck-a06-physical-paper.cjs'
      - 'scripts/audit-deck-a07-typed-rules.cjs'
      - 'scripts/audit-deck-a07-paper-cases.cjs'
      - '01_INFORMACION_PARA_IMPORTAR/decks/**'
      - '.github/workflows/validate-prompts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify user-assigned deck analysis eligibility and loaded zones
        run: node scripts/analysis-eligibility-test.cjs
      - name: Validate universal paper-case contract and synthetic fixtures
        run: node scripts/test-paper-case-contract.cjs
      - name: Validate GPT-owned paper regression scenarios for legacy migration
        run: node scripts/test-p06-legacy-paper-cases.cjs
      - name: Validate 12 Memento route traces without inventing replay parity
        run: node scripts/test-p06-route-trace-contract.cjs
      - name: Verify GPT declarative C01 physical route contract
        run: node scripts/test-p06-physical-route-contract.cjs
      - name: Validate P06 trusted 12-route golden regression manifest
        run: node scripts/test-p06-golden-route-contract.cjs
      - name: Audit 40 protected legacy assertions and recorded source provenance
        run: node scripts/test-p06-legacy-assertion-inventory.cjs
      - name: Audit real image dimensions for explicitly assigned Memento 671
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-images.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json
      - name: Verify Memento 671 HD photos, 39 identities, 69 route steps and shared zone map
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-visual-zone-links.cjs --deck-id=671 --user-assigned --expected=39,12,69,155,13 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json
      - name: Verify Memento A05-T1 official card sources, complete profiles and HD pictures
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-card-profiles.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json
      - name: Verify 39 official Konami card-text source blocks for assigned Memento
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-official-source-text.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json
      - name: Audit effect source metadata for explicitly assigned Memento 671 (no A10B)
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-effect-sources.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json
      - name: Cross-check Konami and Konami-ID-matched secondary text for 39 Memento cards
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/compare-deck-cardtext-sources.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json
      - name: Verify the 94 attributed A05 effect/procedure clauses for selected Memento
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-documental-effects.cjs --deck-id=671 --user-assigned --expected-clauses=94 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO_CONTENIDO_CURADO.md
      - name: Audit assigned Memento A05 semantic/paper coverage without false certification
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-causal-coverage.cjs --deck-id=671 --user-assigned --expected-clauses=94 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO_CONTENIDO_CURADO.md
      - name: Build conditional typed paper suite for assigned Memento (A05 no calculator)
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-paper-model.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO_CONTENIDO_CURADO.md
      - name: Audit physical identity, A05 citations, 40 relations and A06 paper pairs (assigned Memento)
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-a06-synergies.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO_CONTENIDO_CURADO.md
      - name: Validate 80 typed A06 paper states and physical copy conservation (selected Memento)
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-a06-physical-paper.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO_CONTENIDO_CURADO.md
      - name: Verify all 94 A07 effects with exact CID, chain/cost/source and A05 pairs (Memento only)
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-a07-typed-rules.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO_CONTENIDO_CURADO.md
      - name: Verify 658 A07 paper case categories, 94 operator needs and five genuine inventory exclusions
        if: ${{ github.head_ref == 'analysis/memento-671-a01-a10a-20261121' }}
        run: node scripts/audit-deck-a07-paper-cases.cjs --deck-id=671 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/datos/stationx-deck.json 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO/DECK_NUEVO_12_MEMENTOTLAN_DEMONIHERRERO_CONTENIDO_CURADO.md
      - name: Verify 36 protected prompts and A01-A10 import contracts
        run: node scripts/test-a01-a10-presentation.cjs
