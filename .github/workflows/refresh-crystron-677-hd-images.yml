name: Refresh authentic HD images for assigned Crystron 677
on:
  push:
    branches:
      - analysis/crystron-677-a01-20261122
    paths:
      - scripts/refresh-crystron-677-hd-images.py
      - .github/workflows/refresh-crystron-677-hd-images.yml

permissions:
  contents: write

concurrency:
  group: hd-crystron-677-authenticated
  cancel-in-progress: false

jobs:
  replace-verified-photos:
    if: github.repository == 'senior23enginer-coder/gpt-yugioh-promps-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Acquire full authentic English TCG card photos by Konami CID
        run: python scripts/refresh-crystron-677-hd-images.py --deck-id=677 --user-assigned --apply
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all 39 local images have authentic card IDs and HD dimensions
        run: node scripts/audit-deck-images.cjs --deck-id=677 --user-assigned 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_13_CRISTRON_HORUS/datos/stationx-deck.json
      - name: Refuse changes outside the authorized 39 images and provenance
        run: |
          set -euo pipefail
          test "$(git diff --name-only | grep -v -E '^01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_13_CRISTRON_HORUS/imagenes/[0-9]+\.(png|jpg)$' | wc -l)" -eq 0
          test -f 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_13_CRISTRON_HORUS/datos/A04_HD_IMAGE_PROVENANCE.json
          test "$(git diff --name-only | wc -l)" -eq 39
      - name: Commit only CID-verified images and provenance
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_13_CRISTRON_HORUS/imagenes/
          git add -- 01_INFORMACION_PARA_IMPORTAR/decks/DECK_NUEVO_13_CRISTRON_HORUS/datos/A04_HD_IMAGE_PROVENANCE.json
          git diff --cached --quiet && { echo 'No pictures changed'; exit 0; }
          git commit -m 'fix(Crystron A04): replace 39 low-res card photos with CID-matched authentic HD assets'
          git push origin HEAD:analysis/crystron-677-a01-20261122
