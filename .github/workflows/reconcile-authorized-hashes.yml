name: Reconcile protected prompt hashes on authorized feature branch

on:
  push:
    branches:
      - feat/crystron-horus-calculator-contract-20261120

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile approved A01-A10 checksums without rewriting prompts
        run: |
          node scripts/reconcile-protected-prompts.cjs
          git diff --name-only | grep -Fx '03_COMPROBACIONES_NO_IMPORTAR/ESTADO_UNICO_A01_A10_11_DECKS.md'
          node scripts/reconcile-protected-prompts.cjs --check
      - name: Commit exact protected-ledger change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03_COMPROBACIONES_NO_IMPORTAR/ESTADO_UNICO_A01_A10_11_DECKS.md
          git commit -m "chore(prompts): reconcile authorized protected SHA-256 hashes"
          git push origin HEAD:feat/crystron-horus-calculator-contract-20261120
