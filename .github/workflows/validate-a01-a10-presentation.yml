name: Validate A01-A10 presentation contract
on:
  pull_request:
    branches: [base]
    paths:
      - '02_PROMPT_PARA_CODEX/**'
      - '01_INFORMACION_PARA_IMPORTAR/decks/**'
      - 'scripts/test-a01-a10-presentation.cjs'
      - 'scripts/a01-profile-contract.cjs'
      - 'scripts/test-a01-profile-contract.cjs'
      - 'scripts/a01-player-guide-contract.cjs'
      - 'scripts/test-a01-player-guide-contract.cjs'
      - '.github/workflows/validate-a01-a10-presentation.yml'
  push:
    branches: [base]
    paths:
      - '02_PROMPT_PARA_CODEX/**'
      - '01_INFORMACION_PARA_IMPORTAR/decks/**'
      - 'scripts/test-a01-a10-presentation.cjs'
      - 'scripts/a01-profile-contract.cjs'
      - 'scripts/test-a01-profile-contract.cjs'
      - 'scripts/a01-player-guide-contract.cjs'
      - 'scripts/test-a01-player-guide-contract.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 39 protected prompts, A01-A10 deliverables and existing deck safety
        run: node scripts/test-a01-a10-presentation.cjs
      - name: Check A01 profile and Markdown-JSON parity on synthetic data
        run: node scripts/test-a01-profile-contract.cjs
      - name: Validate the assigned Memento player guide, provenance and negative cases
        run: node scripts/test-a01-player-guide-contract.cjs
